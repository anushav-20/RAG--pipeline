[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragpipe"
version = "0.1.0"
description = "Production-style RAG pipeline: hybrid retrieval (BM25 + dense, RRF), reranking, cited answers with Claude, evaluation, FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pypdf>=4.0", "anthropic>=0.40", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
ragpipe = "ragpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
